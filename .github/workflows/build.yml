name: build

# Builds LightStage with CMake on macOS (Apple Silicon) and Windows.
# Development branch only - official downloads stay on https://grosserd5.gumroad.com/l/lightstage
on:
  push:
    branches: [ macos ]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Build
        shell: bash
        run: |
          set +e
          cmake --build build -j 3 -- -k 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          echo "---- errors ----"
          grep -E "error:" build.log | sed "s|$GITHUB_WORKSPACE/||g" | sort -u > errors.txt || true
          head -n 200 errors.txt
          # one public annotation per source file (readable without login via the check-runs API)
          if [ -s errors.txt ]; then
            cut -d: -f1 errors.txt | sort | uniq -c | sort -rn | head -n 45 | while read n f; do
              msg=$(grep -F "$f:" errors.txt | head -n 60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
              echo "::error title=$f ($n)::$msg"
            done
          fi
          exit $rc

      - name: Package (app bundle, ad-hoc signature, dmg)
        if: success()
        shell: bash
        run: |
          set -e
          app=build/LightStage/LightStage.app
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app" && echo "signature ok (ad-hoc)"
          mkdir -p dist && cp -R "$app" dist/
          ln -s /Applications dist/Applications
          hdiutil create -volname "LightStage" -srcfolder dist -ov -format UDZO LightStage-macos-arm64.dmg
          plist=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" -c "Print :CFBundleShortVersionString" -c "Print :LSMinimumSystemVersion" "$app/Contents/Info.plist" | tr '\n' ' ')
          icon=$( [ -f "$app/Contents/Resources/LightStage.icns" ] && echo "icns ok" || echo "NO icns" )
          size=$(du -sh LightStage-macos-arm64.dmg | cut -f1)
          files=$(ls "$app/Contents/Resources" | tr '\n' ' ')
          echo "::notice title=App bundle::$plist| $icon | dmg $size | Resources: $files | $(lipo -archs "$app/Contents/MacOS/LightStage")"

      - name: Self test
        if: success()
        continue-on-error: true
        timeout-minutes: 30
        shell: bash
        run: |
          set +e
          # inside the app bundle: program data in Contents/Resources, own data (log, settings) in Application Support
          cd build/LightStage/LightStage.app/Contents/Resources
          LS_SOFTWARE_GL=1 LS_SELFTEST_MAXSEC=1200 ../MacOS/LightStage --selftest & pid=$!
          for i in $(seq 1 1500); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          if kill -0 $pid 2>/dev/null; then
            echo "::error title=Selftest::timeout after 25 min"
            sample $pid 3 -file sample.txt >/dev/null 2>&1
            echo "::warning title=Hang stack (LightStage frames)::$(grep -E 'ls::|main|Selftest|RunSelfTest' sample.txt | sed -E 's/^[ +!:|]*//' | head -n 40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            kill -9 $pid
          fi
          wait $pid; echo "exit $?"
          tail -n 80 selftest.log || true
          sum=$(grep -E "^[0-9]+ OK, [0-9]+ FAIL" selftest.log | tail -n 1); hints=$(grep -c "^\[HINT\]" selftest.log); oks=$(grep -c "^\[ OK \]" selftest.log); sum="${sum:-(no summary) $oks OK so far}, $hints Hinweise"
          echo "::notice title=Selftest macOS::${sum}%0A$(tail -n 12 selftest.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          grep -F "[FAIL]" selftest.log | head -n 40 | sed 's/%/%25/g' | while read -r l; do echo "::warning title=Selftest FAIL::$l"; done
          logf="$HOME/Library/Application Support/LightStage/lightstage.log"
          if [ -f "$logf" ]; then echo "::notice title=lightstage.log (Application Support)::$(tail -n 40 "$logf" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; else echo "::warning title=lightstage.log::not found in Application Support"; fi

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LightStage-macos-arm64
          path: |
            build.log
            LightStage-macos-arm64.dmg
          if-no-files-found: warn

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release -- /m /v:minimal

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: LightStage-windows-x64
          path: build/LightStage/
