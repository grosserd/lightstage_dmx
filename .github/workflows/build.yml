name: build

# Builds LightStage with CMake on macOS (Apple Silicon) and Windows.
# Development branch only - official downloads stay on https://grosserd5.gumroad.com/l/lightstage
on:
  push:
    branches: [ macos ]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Build
        shell: bash
        run: |
          set +e
          cmake --build build -j 3 -- -k 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          echo "---- errors ----"
          grep -E "error:" build.log | sed "s|$GITHUB_WORKSPACE/||g" | sort -u > errors.txt || true
          head -n 200 errors.txt
          # one public annotation per source file (readable without login via the check-runs API)
          if [ -s errors.txt ]; then
            cut -d: -f1 errors.txt | sort | uniq -c | sort -rn | head -n 45 | while read n f; do
              msg=$(grep -F "$f:" errors.txt | head -n 60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
              echo "::error title=$f ($n)::$msg"
            done
          fi
          exit $rc

      - name: Self test
        if: success()
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        run: |
          set +e
          cd build/LightStage
          ./LightStage --selftest & pid=$!
          for i in $(seq 1 360); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          if kill -0 $pid 2>/dev/null; then
            echo "::error title=Selftest::timeout after 6 min"
            sample $pid 3 -file sample.txt >/dev/null 2>&1
            # main thread + other threads: the frames from LightStage's own code
            echo "::warning title=Hang stack (LightStage frames)::$(grep -E 'ls::|main|Selftest|RunSelfTest' sample.txt | sed -E 's/^[ +!:|]*//' | head -n 40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            kill -9 $pid
          fi
          wait $pid; echo "exit $?"
          tail -n 80 selftest.log || true
          # public annotations: summary + every failed check (readable without login)
          sum=$(grep -E "^[0-9]+ OK, [0-9]+ FAIL" selftest.log | tail -n 1)
          echo "::notice title=Selftest macOS::${sum:-no summary (crash?)}%0A$(tail -n 12 selftest.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          grep -F "[FAIL]" selftest.log | head -n 40 | sed 's/%/%25/g' | while read -r l; do echo "::warning title=Selftest FAIL::$l"; done
          if [ -f lightstage.log ]; then echo "::notice title=lightstage.log::$(tail -n 40 lightstage.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; fi

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LightStage-macos-arm64
          path: |
            build.log
            build/LightStage/
          if-no-files-found: warn

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release -- /m /v:minimal

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: LightStage-windows-x64
          path: build/LightStage/
