name: build

# Builds LightStage with CMake on macOS (Apple Silicon) and Windows.
# Development branch only - official downloads stay on https://grosserd5.gumroad.com/l/lightstage
on:
  push:
    branches: [ macos ]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Build
        shell: bash
        run: |
          set +e
          cmake --build build -j 3 -- -k 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          echo "---- errors ----"
          grep -E "error:" build.log | sed "s|$GITHUB_WORKSPACE/||g" | sort -u > errors.txt || true
          head -n 200 errors.txt
          # one public annotation per source file (readable without login via the check-runs API)
          if [ -s errors.txt ]; then
            cut -d: -f1 errors.txt | sort | uniq -c | sort -rn | head -n 45 | while read n f; do
              msg=$(grep -F "$f:" errors.txt | head -n 60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
              echo "::error title=$f ($n)::$msg"
            done
          fi
          exit $rc

      - name: Self test
        if: success()
        continue-on-error: true
        timeout-minutes: 30
        shell: bash
        run: |
          set +e
          cd build/LightStage
          LS_SOFTWARE_GL=1 LS_SELFTEST_MAXSEC=1200 ./LightStage --selftest & pid=$!
          for i in $(seq 1 1500); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          if kill -0 $pid 2>/dev/null; then
            echo "::error title=Selftest::timeout after 25 min"
            sample $pid 3 -file sample.txt >/dev/null 2>&1
            # main thread + other threads: the frames from LightStage's own code
            echo "::warning title=Hang stack (LightStage frames)::$(grep -E 'ls::|main|Selftest|RunSelfTest' sample.txt | sed -E 's/^[ +!:|]*//' | head -n 40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            kill -9 $pid
          fi
          wait $pid; echo "exit $?"
          tail -n 80 selftest.log || true
          # public annotations: summary + every failed check (readable without login)
          sum=$(grep -E "^[0-9]+ OK, [0-9]+ FAIL" selftest.log | tail -n 1); hints=$(grep -c "^\[HINT\]" selftest.log); sum="$sum, $hints Hinweise"
          echo "::notice title=Selftest macOS::${sum:-no summary (crash?)}%0A$(tail -n 12 selftest.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          grep -F "[FAIL]" selftest.log | head -n 40 | sed 's/%/%25/g' | while read -r l; do echo "::warning title=Selftest FAIL::$l"; done
          if [ -f lightstage.log ]; then echo "::notice title=lightstage.log::$(tail -n 40 lightstage.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; fi

      - name: Image probe
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          cd build/LightStage
          python3 -m pip install --quiet --break-system-packages pillow >/dev/null 2>&1 || python3 -m pip install --quiet pillow >/dev/null 2>&1
          for f in selftest_outdoor_sky.png selftest_outdoor_grass.png selftest_outdoor_concrete.png selftest_hall_ref.png; do
            [ -f "$f" ] || continue
            prof=$(python3 - "$f" <<'PY'
          import sys
          from PIL import Image
          im = Image.open(sys.argv[1]).convert('RGB'); w, h = im.size
          rows = []
          for k in range(10):
              y0, y1 = h * k // 10, h * (k + 1) // 10
              px = [im.getpixel((x, y)) for y in range(y0, y1, 4) for x in range(0, w, 8)]
              n = len(px); rows.append('%3d-%3d%%: R %3d G %3d B %3d' % (k*10, k*10+10, sum(p[0] for p in px)//n, sum(p[1] for p in px)//n, sum(p[2] for p in px)//n))
          print('%dx%d%%0A' % (w, h) + '%0A'.join(rows))
          PY
          )
            echo "::notice title=Image $f::$prof"
          done
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LightStage-macos-arm64
          path: |
            build.log
            build/LightStage/
          if-no-files-found: warn

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release -- /m /v:minimal

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: LightStage-windows-x64
          path: build/LightStage/
